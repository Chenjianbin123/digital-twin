<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>石墨灰双床病房 · 模型验收</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; --surface: #172127; --border: #596971; --text: #e9eeee; --muted: #bfced2; --accent: #86dce0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: var(--surface); color: var(--text); font: 14px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
    #scene { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .toolbar { position: absolute; top: 16px; left: 16px; max-width: calc(100% - 32px); padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
    #status { margin: 0; color: var(--muted); max-width: 46em; overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button { min-height: 44px; padding: 8px 12px; color: var(--text); background: transparent; border: 1px solid var(--border); border-radius: 4px; font: inherit; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:focus-visible, canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    button:disabled { opacity: .5; cursor: wait; }
    button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
    [hidden] { display: none !important; }
    @media (max-width: 480px) {
      .toolbar { top: 8px; left: 8px; max-width: calc(100% - 16px); padding: 8px 12px; }
      h1 { font-size: 14px; }
      #status { font-size: 12px; }
      .actions { gap: 4px; margin-top: 8px; }
      button { padding-inline: 8px; }
    }
  </style>
</head>
<body>
  <main id="scene" aria-label="高精度双床病房模型预览" aria-busy="true"></main>
  <section class="toolbar" aria-label="模型验收控制">
    <h1>模型验收 · 非真实患者数据</h1>
    <p id="status" role="status" aria-live="polite">正在加载独立房间与床位模型…</p>
    <div class="actions">
      <button type="button" id="reset" disabled aria-pressed="true">复位</button>
      <button type="button" id="detail" disabled aria-pressed="false">床细节</button>
      <button type="button" id="screen-check" disabled aria-pressed="false">屏幕检查</button>
      <button type="button" id="retry" hidden>重新加载</button>
    </div>
  </section>
  <script type="module" src="./ward-graphite-preview.js"></script>
</body>
</html>
