<html lang="zh-CN">

<div id="app"></div>
<script type="module">
import {createApp, h, ref} from 'vue';
import SwpLoginGate from '/src/components/SwpLoginGate.vue';
import '/src/styles/global.scss';
import '/src/styles/dashboard-theme.scss';
import '/src/styles/entrance-theme.scss';
createApp({setup(){
  const theme=ref('light');
  window.recoveryFixture={setTheme:value=>theme.value=value};
  return ()=>h(SwpLoginGate,{theme:theme.value,onToggleTheme:()=>theme.value=theme.value==='light'?'dark':'light'});
}}).mount('#app');
</script>
